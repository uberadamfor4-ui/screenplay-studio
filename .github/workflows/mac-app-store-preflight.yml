name: Mac App Store environment preflight

on:
  push:
    branches:
      - mac-app-store-preflight-20261024
    paths:
      - .github/workflows/mac-app-store-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    name: Native macOS tools (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify native macOS build tools without credentials
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const { accessSync, constants, appendFileSync } = require('node:fs')
          if (process.platform !== 'darwin' || process.arch !== process.env.EXPECTED_ARCH) {
            throw new Error('Expected a matching native macOS runner, not a cross-platform stub.')
          }
          const read = (command, args) => {
            const result = spawnSync(command, args, { encoding: 'utf8', timeout: 30000, stdio: ['ignore', 'pipe', 'pipe'] })
            if (result.error || result.status !== 0) throw new Error(`Build tool unavailable: ${command}`)
            return result.stdout.trim()
          }
          const tools = ['/usr/bin/codesign', '/usr/bin/pkgbuild', '/usr/bin/productbuild', '/usr/bin/plutil', '/usr/bin/lipo']
          for (const tool of tools) accessSync(tool, constants.X_OK)
          const report = {
            platform: process.platform,
            architecture: process.arch,
            macOS: read('/usr/bin/sw_vers', ['-productVersion']),
            xcode: read('/usr/bin/xcodebuild', ['-version']),
            macOSSDK: read('/usr/bin/xcrun', ['--sdk', 'macosx', '--show-sdk-version']),
            toolsPresent: tools,
            credentialsUsed: false,
            applicationBuilt: false,
            sandboxRuntimeTested: false,
            uploadedToAppStore: false,
          }
          const xcodeVersion = /^Xcode (\d+)(?:\.\d+)*/.exec(report.xcode)
          const sdkVersion = /^(\d+)(?:\.\d+)*$/.exec(report.macOSSDK)
          if (!xcodeVersion || !sdkVersion || Number(xcodeVersion[1]) < 26 || Number(sdkVersion[1]) < 26) {
            throw new Error('The selected modern build baseline requires Xcode 26+ and macOS SDK 26+.')
          }
          console.log(JSON.stringify(report, null, 2))
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Native macOS toolchain\n\n\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\`\n\nEnvironment readiness only. No signing, app build, runtime acceptance or upload was performed.\n`)
          NODE
