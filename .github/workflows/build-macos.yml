name: Build macOS

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Ad-hoc signed package (not notarized) or separate development build"
        type: choice
        options:
          - release
          - development
        default: release
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "assets/**"
      - "build/**"
      - "electron/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "THIRD_PARTY_NOTICES.md"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      SCREENPLAY_MAC_DISTRIBUTION: ${{ github.event.inputs.distribution || 'release' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check native build tools (no Apple credentials)
        run: node scripts/mac-release-preflight.cjs

      - name: Verify native PDF support
        run: node -e "const canvas = require('@napi-rs/canvas'); if (typeof canvas.DOMMatrix !== 'function') process.exit(1); console.log(process.platform, process.arch, 'DOMMatrix ready')"

      - name: Lint
        run: npm run lint

      - name: Layout regression tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Recovery and document-switch acceptance
        run: npm run test:recovery

      - name: Offline writing tools acceptance
        run: npm run test:writing-tools

      - name: PDF typography and Unicode regression
        run: npm run test:pdf

      - name: Build and verify installed DMG and ZIP
        run: |
          if [ "$SCREENPLAY_MAC_DISTRIBUTION" = "release" ]; then
            node scripts/build-macos.cjs
          else
            node scripts/build-macos.cjs --development
          fi

      - name: Upload ad-hoc signed package (NOT notarized)
        if: env.SCREENPLAY_MAC_DISTRIBUTION == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: screenplay-studio-macos-${{ matrix.arch }}
          path: |
            release/Screenplay-Studio-*.dmg
            release/Screenplay-Studio-*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload development-only artifact
        if: env.SCREENPLAY_MAC_DISTRIBUTION == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: screenplay-studio-macos-${{ matrix.arch }}-development-NOT-FOR-DISTRIBUTION
          path: |
            release/mac-development/Screenplay-Studio-*-development.dmg
            release/mac-development/Screenplay-Studio-*-development.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload distribution acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-distribution-acceptance-${{ matrix.arch }}-${{ env.SCREENPLAY_MAC_DISTRIBUTION }}
          path: acceptance-results/
          if-no-files-found: ignore
          retention-days: 14
