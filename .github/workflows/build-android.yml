name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-android.yml', '.github/release-tools/android-process-survival.sh', 'src/**', 'package-lock.json']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci && npm ci --prefix mobile
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify distinct Unicode glyphs, outlines and advances
        run: |
          python -m pip install fonttools==4.67.0
          python mobile/scripts/prepare-cjk-fonts.py --verify
          python mobile/scripts/make-unicode-probe.py
      - run: npm run build --prefix mobile && npm run sync --prefix mobile
      - name: Prepare import fixtures
        run: |
          mkdir -p mobile/android/app/src/androidTest/assets
          cp tests/fixtures/document-import/last-bus* mobile/android/app/src/androidTest/assets/
      - name: Build APKs and instrumented tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
          mkdir -p ../../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../../android-artifacts/
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../android-artifacts/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../../android-artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ../../android-artifacts/
          printf '%s\n' "$GITHUB_SHA" > ../../android-artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-build
          path: android-artifacts/
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: Android-build
          path: android-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber==0.11.7
      - name: Prepare old-to-new upgrade with an isolated test signing identity
        run: |
          curl --fail --location --output android-artifacts/previous.apk https://github.com/uberadamfor4-ui/screenplay-studio/releases/download/android-v0.1.4/Screenplay-Studio-Android-0.1.4.apk
          java --class-path android-artifacts/apksigner.jar .github/release-tools/VerifyAndroidCertificate.java android-artifacts/previous.apk .github/release-tools/android-release-certificate.pem
          keytool -genkeypair -alias acceptance -keyalg RSA -keystore /tmp/acceptance.p12 -storepass android-test-only -keypass android-test-only -validity 2 -dname CN=TemporaryAcceptance
          for pair in 'previous.apk previous-test.apk' 'app-debug.apk current-test.apk' 'app-debug-androidTest.apk instrumentation-test.apk'; do
            set -- $pair
            java -jar android-artifacts/apksigner.jar sign --ks /tmp/acceptance.p12 --ks-key-alias acceptance --ks-pass pass:android-test-only --out "android-artifacts/$2" "android-artifacts/$1"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p android-evidence
            adb install android-artifacts/previous-test.apk
            adb install android-artifacts/instrumentation-test.apk
            adb shell am instrument -w -r -e class 'studio.screenplay.writer.mobile.MobileAcceptanceTest#seedOldVersionForUpgrade' studio.screenplay.writer.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/seed-old.txt
            grep -q 'OK (1 test)' android-evidence/seed-old.txt
            adb install -r android-artifacts/current-test.apk
            adb shell am instrument -w -r -e class 'studio.screenplay.writer.mobile.MobileAcceptanceTest#verifiesOldVersionUpgrade' studio.screenplay.writer.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/upgrade.txt
            grep -q 'OK (1 test)' android-evidence/upgrade.txt
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime enable studio.screenplay.writer.mobile/.AcceptanceInputMethod
            adb shell ime set studio.screenplay.writer.mobile/.AcceptanceInputMethod
            adb shell am instrument -w -r -e class 'studio.screenplay.writer.mobile.MobileAcceptanceTest#nativeWritingImportRecoveryAndPdf,studio.screenplay.writer.mobile.MobileAcceptanceTest#rejectsOversizedAndUnsafeFiles' studio.screenplay.writer.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/studio.screenplay.writer.mobile/files android-evidence/device || true
            adb logcat -d > android-evidence/logcat.txt
            python mobile/scripts/verify-pdf-copy.py android-evidence/device/native-output.pdf mobile/android/app/src/androidTest/assets/unicode-copy-expected.json android-evidence/pdf-copy-validation.json
            adb shell screencap -p /sdcard/acceptance.png
            adb pull /sdcard/acceptance.png android-evidence/
            adb logcat -d > android-evidence/logcat.txt
            grep -q 'OK (2 tests)' android-evidence/instrumentation.txt
            adb shell am instrument -w -r -e class 'studio.screenplay.writer.mobile.MobileAcceptanceTest#recoveryWriteFailuresNeverReplaceThePreviousDraft,studio.screenplay.writer.mobile.MobileAcceptanceTest#lockScreenCyclesPreserveFinalNativeInput' studio.screenplay.writer.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/survival.txt
            grep -q 'OK (2 tests)' android-evidence/survival.txt
            bash .github/release-tools/android-process-survival.sh
            adb install -r android-artifacts/current-test.apk
            adb shell am instrument -w -r -e class 'studio.screenplay.writer.mobile.MobileAcceptanceTest#retainsProjectAfterOverwrite' studio.screenplay.writer.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee android-evidence/overwrite.txt
            grep -q 'OK (1 test)' android-evidence/overwrite.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-acceptance-api-${{ matrix.api }}
          path: android-evidence/
